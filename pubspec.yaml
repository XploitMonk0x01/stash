name: stash
description: "Stash — Smart link-saving app with cloud sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Utilities
  metadata_fetch: ^0.4.1
  url_launcher: ^6.3.1
  share_handler: ^0.0.21
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  golden_toolkit: ^0.15.0
  network_image_mock: ^2.1.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/auth_bg.png
